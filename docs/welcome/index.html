<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#fff7e9">
<meta name="description" content="EatMates עוזרת לחברים לתכנן ארוחה או מפגש, לאשר הגעה ולחלק מי מביא מה.">
<link rel="icon" href="../icons/eatmates-logo.png">
<link rel="stylesheet" href="style.css">
<title>EatMates | מארגנים מפגש עם חברים</title>
<style>
.instagram-button { gap: .55rem; color: #fff; border-color: transparent; background: linear-gradient(110deg, #9b3200, #ae174c 45%, #6728aa); }
.instagram-button svg { flex: none; }
.hero { grid-template-columns: minmax(0, 1fr); justify-items: center; gap: 1.25rem; padding-block: 1.65rem 2.5rem; }
.hero .tv-area { width: min(100%, 565px); }
.intro { text-align: center; width: 100%; }
.intro h1 { font-size: clamp(2rem, 5vw, 3.65rem); }
.large .intro h1 { font-size: clamp(2.5rem, 6.25vw, 4.56rem); }
.intro .actions { justify-content: center; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.get { display: block; max-width: 565px; margin-inline: auto; }
#platform-tabs { display: flex; flex-wrap: wrap; gap: .5rem; margin-block: 1rem .75rem; }
#platform-tabs button { flex: 1 1 125px; min-height: 44px; color: var(--strong); background: var(--card); border: 1px solid var(--strong); border-radius: 8px; font-weight: 700; }
#platform-tabs [aria-selected="true"] { background: var(--strong); color: #fff; }
.stores { display: block; }
.stores article + article { margin-top: .5rem; }
</style>
</head>
<body>
<a class="skip" href="#main">דילוג לתוכן</a>
<header class="wrap top">
<a class="brand" href="./" aria-label="EatMates, דף הבית"><img src="../icons/eatmates-logo.png" alt="" width="45" height="45"><b lang="en" dir="ltr">Eat<span>Mates</span></b></a>
</header>
<main id="main" class="wrap">
<section class="hero" aria-labelledby="headline">
<figure class="tv-area" aria-label="EatMates בפעולה">
<div class="antenna" aria-hidden="true"></div>
<div class="tv">
<div class="screen"><video id="film" controls muted playsinline preload="metadata" poster="poster.png" aria-label="הדגמה של EatMates" aria-describedby="demo-copy" src="demo.mp4"></video></div>
<div class="panel" aria-hidden="true"><div class="dial"></div><div class="dial small"></div><div class="speaker"></div></div>
</div>
<p class="sr-only" id="demo-copy">פותחים מפגש ובוחרים מה חוגגים ומתי. משתפים קישור עם החברים, מקבלים אישורי הגעה ומחלקים מי מביא מה. קטע ההדגמה מלווה בצלילים קצרים, ללא דיבור.</p>
</figure>
<div class="intro">
<h1 id="headline">נפגשים. <em>מי מביא מה?</em></h1>
<div class="actions">
<a class="button instagram-button" href="https://www.instagram.com/eatmates.events/">
<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>
תעקבו גם באינסטוש</a>
</div>
</div>
</section>
<section id="get" class="get" aria-labelledby="get-title">
<div><h2 id="get-title">מתחילים מהטלפון</h2><p>סרקו קוד עם המצלמה, או לחצו על הקישור מהמכשיר שלכם.</p></div>
<div id="platform-tabs" role="tablist" aria-label="בחירת מכשיר" hidden>
<button type="button" role="tab" id="tab-android" aria-controls="panel-android" aria-selected="false">אנדרואיד</button>
<button type="button" role="tab" id="tab-web" aria-controls="panel-web" aria-selected="false">אייפון ודפדפן</button>
</div>
<div class="stores">
<article role="tabpanel" id="panel-android" aria-labelledby="tab-android"><img width="96" height="96" src="android.svg" alt="קוד QR ל־Google Play"><div><a href="https://play.google.com/store/apps/details?id=com.eatmates.app" >הורדה מ־Google Play</a></div></article>
<article role="tabpanel" id="panel-web" aria-labelledby="tab-web"><img width="96" height="96" src="web.svg" alt="קוד QR לגרסת הווב של EatMates"><div><a href="../preview/">פתיחת גרסת הווב</a></div></article>
</div>
</section>
</main>
<footer class="wrap footer"><span dir="ltr" lang="en">EatMates</span><a href="https://djmotti.github.io/eatmates-privacy-policy/">מדיניות פרטיות</a><a href="https://djmotti.github.io/eatmates-privacy-policy/#accessibility">הצהרת נגישות</a></footer>
<button id="access-button" class="access-button" type="button" aria-haspopup="dialog" hidden>
<svg viewBox="0 0 32 32" width="27" height="27" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="16" cy="6.3" r="2.1" fill="currentColor"/><path d="M8 12l8 2 8-2m-8 2v6m0 0-4 6m4-6 4 6M4 9v6m3-6v6m-3 1h3m-1.5 0v9M28 9c-2 0-3 3-3 6h3v10"/></svg>
נגישות
</button>
<dialog id="access-menu" aria-labelledby="access-menu-title">
<form method="dialog"><button class="close" aria-label="סגירת תפריט הנגישות" autofocus>✕</button></form>
<h2 id="access-menu-title">התאמות נגישות</h2>
<label><input type="checkbox" id="big-text"> הגדלת טקסט</label>
<label><input type="checkbox" id="contrast"> ניגודיות גבוהה</label>
<label><input type="checkbox" id="still"> ביטול הפעלה אוטומטית של הווידאו</label>
<a id="statement-link" href="https://djmotti.github.io/eatmates-privacy-policy/#accessibility">להצהרת הנגישות וליצירת קשר</a>
<p><a href="mailto:eatmates.events@gmail.com?subject=EatMates%20Accessibility">מייל לפניות נגישות</a></p>
</dialog>
<script>
const film = document.querySelector('#film');
const accessButton = document.querySelector('#access-button');
const menu = document.querySelector('#access-menu');
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)');

function getPreference(key) {
  try { return localStorage.getItem('eatmates-welcome-' + key) === 'true'; }
  catch { return false; }
}

function bindPreference(id, apply) {
  const input = document.getElementById(id);
  input.checked = getPreference(id);
  apply(input.checked);
  input.addEventListener('change', () => {
    apply(input.checked);
    try { localStorage.setItem('eatmates-welcome-' + id, String(input.checked)); }
    catch { /* Preferences still apply to this page. */ }
  });
}

bindPreference('big-text', enabled => document.documentElement.classList.toggle('large', enabled));
bindPreference('contrast', enabled => document.documentElement.classList.toggle('contrast', enabled));
bindPreference('still', enabled => {
  film.autoplay = !enabled && !reduceMotion.matches;
  if (enabled) film.pause();
});
reduceMotion.addEventListener('change', event => {
  film.autoplay = !event.matches && !document.querySelector('#still').checked;
  if (event.matches) film.pause();
});

film.muted = true;
accessButton.hidden = false;
accessButton.addEventListener('click', () => menu.showModal());

const tabList = document.querySelector('#platform-tabs');
const tabs = Array.from(tabList.querySelectorAll('button'));
function selectTab(selected) {
  for (const tab of tabs) {
    const active = tab === selected;
    tab.setAttribute('aria-selected', String(active));
    tab.tabIndex = active ? 0 : -1;
    document.getElementById(tab.getAttribute('aria-controls')).hidden = !active;
  }
}

for (const tab of tabs) {
  tab.addEventListener('click', () => selectTab(tab));
}
tabList.addEventListener('keydown', event => {
  const index = tabs.indexOf(event.target);
  const destination = { ArrowLeft: (index + 1) % tabs.length, ArrowRight: (index + tabs.length - 1) % tabs.length, Home: 0, End: tabs.length - 1 }[event.key];
  if (destination === undefined) return;
  event.preventDefault();
  selectTab(tabs[destination]);
  tabs[destination].focus();
});
const platform = navigator.userAgentData?.platform || navigator.userAgent;
selectTab(tabs[/Android/i.test(platform) ? 0 : 1]);
tabList.hidden = false;
</script>
</body>
</html>
